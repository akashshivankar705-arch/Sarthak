<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password 🎂</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        /* Intro Video Styling */
        .video-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-bottom: 8px;
        }

        video {
            width: 100%;
            display: block;
        }

        /* Watermark Bar */
        .watermark-bar {
            background: #f0f0f0;
            color: #777;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #ff4b2b;
        }

        button {
            width: 90%;
            padding: 12px;
            background: #ff4b2b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #ff416c;
        }

        /* Hidden Error Area for Wrong Password */
        #errorSection {
            display: none;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #ff4b2b;
        }

        #errorSection h3 {
            color: #ff4b2b;
            margin: 0 0 10px 0;
            font-size: 1.1rem;
        }

        .gif-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
        }

        .gif-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Main Intro Video -->
        <div class="video-container">
            <video controls autoplay>
                <source src="intro.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Watermark Bar -->
        <div class="watermark-bar">
            Created with ❤️ by [Your Name]
        </div>

        <!-- Password Form -->
        <form id="passwordForm">
            <input type="password" id="passwordInput" placeholder="Enter secret password..." required>
            <button type="submit">Unlock Surprise 🎉</button>
        </form>

        <!-- Inline Wrong Password Section (Displays automatically on wrong password) -->
        <div id="errorSection">
            <h3>❌ Wrong Password! Try again!</h3>
            <div class="gif-container">
                <img src="wrong.gif" alt="Wrong Password GIF">
            </div>
        </div>
    </div>

    <script>
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const correctPassword = "Sarthak"; 
            const userInput = document.getElementById('passwordInput').value;
            const errorSection = document.getElementById('errorSection');

            if (userInput === correctPassword) {
                // Hides error if visible and goes to page 2
                errorSection.style.display = "none";
                window.location.href = "birthday.html";
            } else {
                // Displays the GIF and error message directly on this page
                errorSection.style.display = "block";
                document.getElementById('passwordInput').value = ""; // Clears the input
            }
        });
    </script>

</body>
</html>
